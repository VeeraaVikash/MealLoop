openapi: 3.0.3
info:
  title: MealLoop API (first slice)
  version: 0.2.0-draft
  description: |
    PROPOSAL. REST contracts for the shared dining operations the iOS `RemoteAPI` calls (student answers, headcount,
    door entry, meal state, shortages, waste reports, SOS, sign-in). Nothing here is implemented and no server exists.
    See docs/backend/BACKEND_PROPOSAL.md.

    Status of the operations (ADR-005, FE-6: an approach decision, not approval of these endpoints):
    - 0.1.0 (23 Oct 2026): the 12 first-slice operations, still unreviewed.
    - 0.2.0 (15 Nov 2026): 21 operations drafted so that every method of the Swift repository contracts has an
      operation; each is marked "DRAFT 0.2.0". Some 0.1.0 shapes changed to match the domain models (Headcount,
      MealStatus, EntryRequest, EntryRecorded, Shortage). docs/OPEN_DECISIONS.md (NET-5 to NET-12) lists every change.

    Rules that every implementation must keep:
    - Missing values are explicit (`notEntered`, `unavailable`); a missing value is never returned as 0.
    - Writes that must not apply twice (entries, shortages) require an `Idempotency-Key` header. Repeating a request
      with the same key returns the original response.
    - A student is never counted twice for one meal; a second entry returns `409` with `already_recorded`.
    - An entry that could not be verified and saved is an error, never a success.
    - Core dining endpoints never call the intelligence service.

    Versioning: the major version is in the path (`/v1`). Additive changes keep the version; breaking changes
    move to `/v2`, and `/v1` stays available while the iOS app version that uses it is supported.
servers:
  - url: https://api.example.invalid/v1
    description: Placeholder. No server exists yet.
security:
  - bearerAuth: []
tags:
  - name: Staff sessions
  - name: Meals
  - name: Intentions
  - name: Headcount
  - name: Entries
  - name: Shortages
  - name: Waste reports
  - name: SOS
  - name: Students
  - name: Sessions
paths:
  /staff/sessions:
    post:
      tags: [Staff sessions]
      operationId: createStaffSession
      summary: Exchange the shared role password for a staff session token (LEGACY, prototype only)
      description: |
        LEGACY. ADR-005: the shared four-digit role password is not the production authentication contract and must
        not be built on. The iOS `RemoteAPI` does not call this operation (NET-9). Kept only as the record of the
        prototype flow. One password per role and mess, 4 digits, 3 tries per device, then locked.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffSessionRequest'
      responses:
        '201':
          description: Password accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffSession'
        '401':
          description: Wrong password.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WrongPasswordProblem'
        '423':
          description: Locked after 3 wrong tries.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '400':
          $ref: '#/components/responses/ValidationFailed'

  /messes/{messId}/meals:
    get:
      tags: [Meals]
      operationId: listMeals
      summary: List the meals of a mess on a service date, with menu and state
      description: 'Roles: any signed-in role of this mess.'
      parameters:
        - $ref: '#/components/parameters/MessId'
        - name: date
          in: query
          required: false
          description: |
            Service date in the mess's time zone. DRAFT 0.2.0: optional; when omitted the server uses its own current
            service date (server time in IST is authoritative, NFR-REL-010) (NET-8).
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Meals for the date (Breakfast, Lunch, Snacks, Dinner as published).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Meal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /meals/{mealId}/intentions/me:
    get:
      tags: [Intentions]
      operationId: getMyIntention
      summary: DRAFT 0.2.0. The signed-in student's answer for a meal
      description: "'Roles: student.' `noResponse` is its own group and never a skip."
      parameters:
        - $ref: '#/components/parameters/MealId'
      responses:
        '200':
          description: The answer, or noResponse.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Intentions]
      operationId: setMyIntention
      summary: Set or update the signed-in student's answer for a meal
      description: |
        'Roles: student.' Allowed until the cutoff (two hours before the meal). The entry QR never depends on this.
      parameters:
        - $ref: '#/components/parameters/MealId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntentionRequest'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentionResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The cutoff has passed (`cutoff_passed`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /meals/{mealId}/headcount:
    get:
      tags: [Headcount]
      operationId: getHeadcount
      summary: Forecast, headcount sent to the vendor, and the vendor reply
      description: 'Roles: admin, supervisor, kitchenStaff (forecast only before the meal).'
      parameters:
        - $ref: '#/components/parameters/MealId'
      responses:
        '200':
          description: Headcount.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Headcount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /meals/{mealId}/state:
    get:
      tags: [Meals]
      operationId: getMealState
      summary: The meal's lifecycle state (drives every staff role in the mess)
      description: 'Roles: any staff role of this mess, admin.'
      parameters:
        - $ref: '#/components/parameters/MealId'
      responses:
        '200':
          description: Current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /meals/{mealId}/start:
    post:
      tags: [Meals]
      operationId: startMeal
      summary: Start the meal (Door Scanner and Pass Desk open)
      description: 'Roles: supervisor.'
      parameters:
        - $ref: '#/components/parameters/MealId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Not in the `notStarted` state (`invalid_state`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /meals/{mealId}/close:
    post:
      tags: [Meals]
      operationId: closeMeal
      summary: Close the meal (scanning and pass checks stop)
      description: 'Roles: supervisor. Closing does not resolve shortages or complete a waste report.'
      parameters:
        - $ref: '#/components/parameters/MealId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Not in the `inService` state (`invalid_state`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /meals/{mealId}/entries:
    post:
      tags: [Entries]
      operationId: recordEntry
      summary: Record a verified entry at the door (QR scan or last 4 digits)
      description: |
        'Roles: doorScanner.' Only while the meal is in service. There is no decline step: a student with no answer is
        recorded and also listed under "Entered without voting". If the server cannot verify and save the entry it
        returns an error and nothing is recorded; the app never shows success for it.
      parameters:
        - $ref: '#/components/parameters/MealId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryRequest'
      responses:
        '201':
          description: Entry recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryRecorded'
        '409':
          description: Already recorded for this meal (`already_recorded`), or the meal is not in service (`invalid_state`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AlreadyRecordedProblem'
        '422':
          description: The QR is not a MealLoop entry code (`qr_not_recognised`) or is for another meal (`wrong_meal`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /meals/{mealId}/entries/count:
    get:
      tags: [Entries]
      operationId: getEntryCount
      summary: Students entered so far (live) or final entries after the meal closed
      description: 'Roles: kitchenStaff, supervisor, doorScanner, admin. Never meals served.'
      parameters:
        - $ref: '#/components/parameters/MealId'
        - name: kind
          in: query
          required: true
          schema:
            type: string
            enum: [live, final]
      responses:
        '200':
          description: The count, or `unavailable` (never 0 for missing).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountReading'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /meals/{mealId}/shortages:
    get:
      tags: [Shortages]
      operationId: listShortages
      summary: DRAFT 0.2.0. Shortages reported for a meal
      description: 'Roles: kitchenStaff, passDesk, supervisor, admin.'
      parameters:
        - $ref: '#/components/parameters/MealId'
      responses:
        '200':
          description: Shortages, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Shortage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Shortages]
      operationId: reportShortage
      summary: Report food running short (to the Supervisor of the mess)
      description: 'Roles: kitchenStaff, passDesk.'
      parameters:
        - $ref: '#/components/parameters/MealId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShortageReport'
      responses:
        '201':
          description: Reported. Delivery to the Supervisor is retried from a durable record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shortage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /meals/{mealId}/waste-report:
    get:
      tags: [Waste reports]
      operationId: getWasteReport
      summary: The meal's waste report (or an empty one with every field notEntered)
      description: 'Roles: kitchenStaff; supervisor and admin read only.'
      parameters:
        - $ref: '#/components/parameters/MealId'
      responses:
        '200':
          description: Waste report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WasteReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Waste reports]
      operationId: saveWasteReport
      summary: Save a draft, or record the report (after the meal has ended only)
      description: |
        'Roles: kitchenStaff.' `action: record` is rejected while any field is `notEntered` or invalid.
        A recorded report can be edited for 6 hours after it was saved; there is no approval step.
      parameters:
        - $ref: '#/components/parameters/MealId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveWasteReportRequest'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WasteReport'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The meal has not ended (`invalid_state`) or editing closed after 6 hours (`edit_window_closed`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /messes/{messId}/meals/current:
    get:
      tags: [Meals]
      operationId: getCurrentMeal
      summary: DRAFT 0.2.0. The meal the mess is in or about to start
      description: 'Roles: any signed-in role of this mess. `meal` is null when there is no meal today.'
      parameters:
        - $ref: '#/components/parameters/MessId'
      responses:
        '200':
          description: The current meal, or null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentMeal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /messes/{messId}/meal-history:
    get:
      tags: [Meals]
      operationId: listMealHistory
      summary: DRAFT 0.2.0. Closed meals of a mess, newest first
      description: 'Roles: kitchenStaff, supervisor, admin. Read only. A value the record does not have is null or `unavailable`, never 0.'
      parameters:
        - $ref: '#/components/parameters/MessId'
      responses:
        '200':
          description: Closed meals.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MealRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /meals/{mealId}/menu:
    get:
      tags: [Meals]
      operationId: getMenu
      summary: DRAFT 0.2.0. The dishes of one meal
      description: 'Roles: any signed-in role of the meal''s mess.'
      parameters:
        - $ref: '#/components/parameters/MealId'
      responses:
        '200':
          description: Dishes, in menu order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dish'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /meals/{mealId}/intentions/counts:
    get:
      tags: [Intentions]
      operationId: getAnswerCounts
      summary: DRAFT 0.2.0. How many students gave each answer
      description: 'Roles: admin, supervisor. Counts only; a forecast is never derived from them by the client.'
      parameters:
        - $ref: '#/components/parameters/MealId'
      responses:
        '200':
          description: Counts per answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerCounts'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /meals/{mealId}/headcount/approval:
    put:
      tags: [Headcount]
      operationId: approveHeadcount
      summary: DRAFT 0.2.0. Approve the headcount (Food Head / Admin)
      description: |
        'Roles: admin.' A count that differs from the forecast or an earlier approval needs a reason. Repeating the same
        count changes nothing. Refused once the headcount has been sent (`invalid_state`). Never automatic (FR-HC-005).
      parameters:
        - $ref: '#/components/parameters/MealId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveHeadcountRequest'
      responses:
        '200':
          description: The headcount with its approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Headcount'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Already sent (`invalid_state`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /meals/{mealId}/headcount/publication:
    post:
      tags: [Headcount]
      operationId: publishHeadcount
      summary: DRAFT 0.2.0. Send the approved headcount to the vendor account
      description: 'Roles: admin. Publishing is never an acknowledgment. A repeat with the same key changes nothing.'
      parameters:
        - $ref: '#/components/parameters/MealId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The headcount with `sentToVendor` set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Headcount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Not approved yet (`invalid_state`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /meals/{mealId}/headcount/acknowledgment:
    post:
      tags: [Headcount]
      operationId: acknowledgeHeadcount
      summary: DRAFT 0.2.0. The vendor account confirms receipt
      description: 'Roles: vendor (its own account only). A repeat returns the first acknowledgment unchanged.'
      parameters:
        - $ref: '#/components/parameters/MealId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The headcount with `acknowledgment` set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Headcount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Not published yet (`invalid_state`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /meals/{mealId}/entries/without-answer:
    get:
      tags: [Entries]
      operationId: listEnteredWithoutAnswer
      summary: DRAFT 0.2.0. Students who entered without answering
      description: 'Roles: doorScanner, supervisor (P12). Not a vote and never mixed with answers.'
      parameters:
        - $ref: '#/components/parameters/MealId'
      responses:
        '200':
          description: Entries without an answer, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnteredWithoutVoting'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /meals/{mealId}/entry-credentials:
    post:
      tags: [Entries]
      operationId: resolveEntryCredential
      summary: DRAFT 0.2.0. Check a scanned QR or typed last four digits. Records nothing
      description: |
        'Roles: doorScanner.' A POST so the credential never appears in a URL or an access log. Only a `student` result
        may go on to `recordEntry`.
      parameters:
        - $ref: '#/components/parameters/MealId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveEntryRequest'
      responses:
        '200':
          description: What the credential is.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveEntryResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /students/{studentId}/entry-code:
    get:
      tags: [Students]
      operationId: getEntryCode
      summary: DRAFT 0.2.0. The student's entry code (QR payload and last four digits)
      description: 'Roles: student (own code only). Never gated by the answer, the cutoff or a lost connection.'
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryCode'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /shortages/{shortageId}/resolution:
    put:
      tags: [Shortages]
      operationId: resolveShortage
      summary: DRAFT 0.2.0. Mark a shortage resolved
      description: 'Roles: supervisor. A repeat keeps the first resolution.'
      parameters:
        - $ref: '#/components/parameters/ShortageId'
      responses:
        '200':
          description: The shortage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shortage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /shortages/{shortageId}/seen:
    put:
      tags: [Shortages]
      operationId: markShortageSeen
      summary: DRAFT 0.2.0. The Supervisor has read the report
      description: 'Roles: supervisor. Sets `delivery.status` to `seen`; a repeat keeps the first sighting.'
      parameters:
        - $ref: '#/components/parameters/ShortageId'
      responses:
        '200':
          description: The shortage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shortage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /meals/{mealId}/waste-report/summary:
    get:
      tags: [Waste reports]
      operationId: getWasteReportSummary
      summary: DRAFT 0.2.0. Status and progress of the waste report, without its rows
      description: 'Roles: kitchenStaff, supervisor, admin.'
      parameters:
        - $ref: '#/components/parameters/MealId'
      responses:
        '200':
          description: Summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WasteReportSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /messes/{messId}/sos-cases:
    post:
      tags: [SOS]
      operationId: raiseSOS
      summary: DRAFT 0.2.0. Open an SOS case for the mess
      description: 'Roles: student and every mess staff role. The same key returns the case already opened.'
      parameters:
        - $ref: '#/components/parameters/MessId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SOSReport'
      responses:
        '201':
          description: Opened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SOSCase'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [SOS]
      operationId: listSOSCases
      summary: DRAFT 0.2.0. SOS cases of the mess
      description: 'Roles: every mess staff role, admin.'
      parameters:
        - $ref: '#/components/parameters/MessId'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, closed]
      responses:
        '200':
          description: Cases, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SOSCase'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /sos-cases/{sosCaseId}/claim:
    put:
      tags: [SOS]
      operationId: claimSOS
      summary: DRAFT 0.2.0. "I'll go and check". Does not close the case
      description: 'Roles: every mess staff role. A repeat keeps the first claim.'
      parameters:
        - $ref: '#/components/parameters/SOSCaseId'
      responses:
        '200':
          description: The case.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SOSCase'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /sos-cases/{sosCaseId}/check:
    put:
      tags: [SOS]
      operationId: checkSOS
      summary: DRAFT 0.2.0. Record that this role checked. Does not close the case
      description: 'Roles: every mess staff role. One check per role; a repeat changes nothing.'
      parameters:
        - $ref: '#/components/parameters/SOSCaseId'
      responses:
        '200':
          description: The case.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SOSCase'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /sos-cases/{sosCaseId}/close:
    put:
      tags: [SOS]
      operationId: closeSOS
      summary: DRAFT 0.2.0. Close the case
      description: 'Roles: supervisor only. A repeat keeps the first closing.'
      parameters:
        - $ref: '#/components/parameters/SOSCaseId'
      responses:
        '200':
          description: The case.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SOSCase'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /sessions:
    post:
      tags: [Sessions]
      operationId: createSession
      summary: DRAFT 0.2.0. Sign in with email and password; returns an opaque bearer credential
      description: |
        Accounts other than students (Food Head, Super Admin, Vendor, Guardian, Warden, Gate and staff). The credential
        is opaque (ADR-005): the server keeps only a verifier with its user, device, expiry and revocation status. Its
        format, entropy, lifetimes, renewal, device limits and rate limiting are open (ADR-005, NET-10). A wrong email
        or password is one `401 invalid_credentials`, never saying which.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '201':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: Wrong email or password (`invalid_credentials`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        An opaque bearer credential (ADR-005; the earlier JWT choice of ADR-003 A9 to A12 is superseded). The server
        looks it up against PostgreSQL-backed session records and resolves the account's role and mess or hostel scope;
        the client never reads anything from it. Every endpoint lists the roles it accepts; the server checks role,
        resource and scope. Format, entropy, lifetimes and renewal are open. Student sign-in (SRM) is an open decision.

  parameters:
    MessId:
      name: messId
      in: path
      required: true
      schema:
        type: string
    MealId:
      name: mealId
      in: path
      required: true
      schema:
        type: string
    ShortageId:
      name: shortageId
      in: path
      required: true
      schema:
        type: string
    SOSCaseId:
      name: sosCaseId
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A client-generated unique key (UUID). Repeating it returns the original response.
      schema:
        type: string
        minLength: 8
        maxLength: 128

  responses:
    ValidationFailed:
      description: The request is invalid (`validation_failed`); `errors` lists each field.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or expired token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The role or mess is not allowed to do this.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      description: RFC 9457 problem details with a stable machine-readable `code`.
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          example: already_recorded
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string

    WrongPasswordProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [triesLeft]
          properties:
            triesLeft:
              type: integer
              minimum: 0
              maximum: 2

    AlreadyRecordedProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            firstRecordedAt:
              type: string
              format: date-time
            count:
              type: integer
              minimum: 0
              description: The live count, unchanged by this request.

    Role:
      type: string
      description: The 11 approved roles (ADR-003). DRAFT 0.2.0 adds superAdmin and vendor.
      enum: [student, superAdmin, admin, supervisor, kitchenStaff, doorScanner, passDesk, vendor, guardian, warden, gate]

    StaffSessionRequest:
      type: object
      required: [messId, role, password, deviceId]
      properties:
        messId:
          type: string
        role:
          type: string
          enum: [doorScanner, passDesk, kitchenStaff, supervisor]
        password:
          type: string
          pattern: '^[0-9]{4}$'
        deviceId:
          type: string

    StaffSession:
      type: object
      required: [token, role, messId, staffInitials]
      properties:
        token:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        messId:
          type: string
        staffInitials:
          type: string

    MealSlot:
      type: string
      enum: [breakfast, lunch, snacks, dinner]

    MealState:
      type: string
      enum: [notStarted, inService, closed]

    WasteUnit:
      type: string
      enum: [kg, L, pieces]

    Dish:
      type: object
      required: [id, name, isHighlight, diet, wasteUnit]
      properties:
        id:
          type: string
        name:
          type: string
        isHighlight:
          type: boolean
        diet:
          type: string
          enum: [veg, nonVeg]
        wasteUnit:
          $ref: '#/components/schemas/WasteUnit'

    Meal:
      type: object
      required: [id, messId, slot, startsAt, endsAt, intentionCutoff, menu, state]
      properties:
        id:
          type: string
        messId:
          type: string
        slot:
          $ref: '#/components/schemas/MealSlot'
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        intentionCutoff:
          type: string
          format: date-time
          description: Two hours before `startsAt`.
        menu:
          type: array
          items:
            $ref: '#/components/schemas/Dish'
        state:
          $ref: '#/components/schemas/MealState'
        startedAt:
          type: string
          format: date-time
          nullable: true
          description: DRAFT 0.2.0. Null until the Supervisor starts the meal.
        closedAt:
          type: string
          format: date-time
          nullable: true
          description: DRAFT 0.2.0. Null until the Supervisor closes the meal.

    MealStatus:
      description: DRAFT 0.2.0 (was mealId, state, startedAt, closedAt). The state together with the meal it belongs to, which every staff screen shows.
      type: object
      required: [meal]
      properties:
        meal:
          $ref: '#/components/schemas/Meal'

    CurrentMeal:
      description: DRAFT 0.2.0.
      type: object
      required: [meal]
      properties:
        meal:
          allOf:
            - $ref: '#/components/schemas/Meal'
          nullable: true

    MealIntention:
      type: string
      enum: [in, skip, notSure]

    IntentionRequest:
      type: object
      required: [intention]
      properties:
        intention:
          $ref: '#/components/schemas/MealIntention'
        reason:
          type: string
          maxLength: 200
          nullable: true
          description: Optional reason for skipping. How reasons are used and kept is an open decision.

    IntentionResponse:
      type: object
      required: [mealId, response]
      properties:
        mealId:
          type: string
        response:
          type: string
          enum: [answered, noResponse]
          description: '`noResponse` is its own group and never a skip.'
        intention:
          allOf:
            - $ref: '#/components/schemas/MealIntention'
          nullable: true
        answeredAt:
          type: string
          format: date-time
          nullable: true

    Forecast:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, notReady]
        diners:
          type: integer
          minimum: 0
          nullable: true
          description: Present only when `status` is `ready`.
        setAt:
          type: string
          format: date-time
          nullable: true

    HeadcountAdjustment:
      type: object
      required: [from, to, reason, adjustedBy, adjustedAt]
      properties:
        from:
          type: integer
        to:
          type: integer
        reason:
          type: string
          minLength: 1
        adjustedBy:
          $ref: '#/components/schemas/Role'
        adjustedAt:
          type: string
          format: date-time

    Headcount:
      type: object
      description: |
        DRAFT 0.2.0 (was forecast, sent and vendorReply). The six headcount values of one meal (PRD FR-HC-002), each
        separate: no field is ever filled from another. `approved`, `sentToVendor` and `acknowledgment` are null until
        they happen. The vendor receives a headcount only, never dish quantities (NET-6).
      required: [mealId, liveForecast, cutoffForecast, actualEntries, finalEntries]
      properties:
        mealId:
          type: string
        liveForecast:
          $ref: '#/components/schemas/Forecast'
        cutoffForecast:
          $ref: '#/components/schemas/Forecast'
        approved:
          type: object
          nullable: true
          required: [count, approvedBy, approvedAt, adjustments]
          properties:
            count:
              type: integer
              minimum: 0
            approvedBy:
              $ref: '#/components/schemas/Role'
            approvedAt:
              type: string
              format: date-time
            adjustments:
              type: array
              items:
                $ref: '#/components/schemas/HeadcountAdjustment'
        sentToVendor:
          type: object
          nullable: true
          required: [count, sentBy, sentAt]
          properties:
            count:
              type: integer
              minimum: 0
            sentBy:
              $ref: '#/components/schemas/Role'
            sentAt:
              type: string
              format: date-time
        actualEntries:
          $ref: '#/components/schemas/CountReading'
        finalEntries:
          $ref: '#/components/schemas/CountReading'
        acknowledgment:
          type: object
          nullable: true
          required: [acknowledgedBy, acknowledgedAt]
          properties:
            acknowledgedBy:
              type: string
              description: The vendor account.
            acknowledgedAt:
              type: string
              format: date-time

    ApproveHeadcountRequest:
      description: DRAFT 0.2.0.
      type: object
      required: [count]
      properties:
        count:
          type: integer
          minimum: 0
        reason:
          type: string
          nullable: true
          description: Required when the count differs from the forecast or an earlier approval.

    EntryRequest:
      type: object
      description: |
        DRAFT 0.2.0 (was qrPayload or studentId by method). The app first resolves the credential
        (`resolveEntryCredential`), so it always sends the resolved `studentId`; `method` says how it was read (NET-7).
      required: [method, studentId]
      properties:
        method:
          type: string
          enum: [qrScan, typedLastFour]
        studentId:
          type: string

    EntryRecorded:
      type: object
      description: DRAFT 0.2.0 (was studentMaskedId). Carries the student reference and the method, as the door screen shows them.
      required: [entryId, mealId, student, method, recordedAt, hadMealResponse, count]
      properties:
        entryId:
          type: string
        mealId:
          type: string
        student:
          $ref: '#/components/schemas/StudentRef'
        method:
          type: string
          enum: [qrScan, typedLastFour]
        recordedAt:
          type: string
          format: date-time
        hadMealResponse:
          type: boolean
          description: False adds the student to "Entered without voting".
        count:
          type: integer
          minimum: 0

    CountReading:
      type: object
      required: [status, kind]
      properties:
        status:
          type: string
          enum: [available, unavailable]
        kind:
          type: string
          enum: [live, final]
        count:
          type: integer
          minimum: 0
          nullable: true
          description: Present only when `status` is `available`. Never 0 for missing.
        asOf:
          type: string
          format: date-time
          nullable: true

    ShortageLevel:
      type: string
      enum: [gettingLow, almostOut, out]

    ShortageReport:
      type: object
      required: [dishName, level, reportedBy]
      properties:
        dishName:
          type: string
          minLength: 1
        level:
          $ref: '#/components/schemas/ShortageLevel'
        note:
          type: string
          maxLength: 280
          nullable: true
        reportedBy:
          type: string
          enum: [kitchenStaff, passDesk]

    Shortage:
      type: object
      required: [id, mealId, dishName, level, reportedAt, reportedBy, delivery, status]
      properties:
        id:
          type: string
        mealId:
          type: string
        dishName:
          type: string
        level:
          $ref: '#/components/schemas/ShortageLevel'
        note:
          type: string
          nullable: true
        reportedAt:
          type: string
          format: date-time
        reportedBy:
          $ref: '#/components/schemas/Role'
        delivery:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [sent, seen]
              description: '`seen` only when the Supervisor confirmed it.'
            at:
              type: string
              format: date-time
            by:
              type: string
              nullable: true
              description: DRAFT 0.2.0. Who saw it; present only when `status` is `seen`.
        status:
          type: string
          enum: [active, resolved]
        resolvedAt:
          type: string
          format: date-time
          nullable: true
          description: DRAFT 0.2.0. Present only when `status` is `resolved`.

    LeftoverMeasurement:
      type: object
      required: [state]
      description: Missing data is `notEntered`, never 0. A confirmed zero is `noneLeft`.
      properties:
        state:
          type: string
          enum: [entered, noneLeft, notMade, notEntered]
        value:
          type: number
          exclusiveMinimum: true
          minimum: 0
          nullable: true
          description: Required, and greater than 0, only when `state` is `entered`.

    DishLeftover:
      type: object
      required: [dishId, dishName, unit, measurement]
      properties:
        dishId:
          type: string
        dishName:
          type: string
        unit:
          $ref: '#/components/schemas/WasteUnit'
        measurement:
          $ref: '#/components/schemas/LeftoverMeasurement'

    PlateWaste:
      type: object
      required: [state]
      description: One total for the whole meal, in kilograms. Never per dish.
      properties:
        state:
          type: string
          enum: [entered, notEntered]
        kilograms:
          type: number
          minimum: 0
          nullable: true

    WasteReport:
      type: object
      required: [mealId, leftovers, plateWaste, status]
      properties:
        mealId:
          type: string
        leftovers:
          type: array
          items:
            $ref: '#/components/schemas/DishLeftover'
        plateWaste:
          $ref: '#/components/schemas/PlateWaste'
        status:
          type: string
          enum: [notStarted, draft, recorded]
        savedAt:
          type: string
          format: date-time
          nullable: true
        editableUntil:
          type: string
          format: date-time
          nullable: true
          description: savedAt + 6 hours when recorded.

    SaveWasteReportRequest:
      type: object
      required: [action, leftovers, plateWaste]
      properties:
        action:
          type: string
          enum: [saveDraft, record]
        leftovers:
          type: array
          items:
            $ref: '#/components/schemas/DishLeftover'
        plateWaste:
          $ref: '#/components/schemas/PlateWaste'

    WasteReportSummary:
      description: DRAFT 0.2.0.
      type: object
      required: [mealId, status, completedFieldCount, totalFieldCount]
      properties:
        mealId:
          type: string
        status:
          type: string
          enum: [notStarted, draft, recorded]
        savedAt:
          type: string
          format: date-time
          nullable: true
        completedFieldCount:
          type: integer
          minimum: 0
        totalFieldCount:
          type: integer
          minimum: 1

    MealRecord:
      description: DRAFT 0.2.0. One closed meal for Meal history. A value the record does not have is null or `unavailable`.
      type: object
      required: [mealId, messId, slot, day, finalEntries, shortages, waste]
      properties:
        mealId:
          type: string
        messId:
          type: string
        slot:
          $ref: '#/components/schemas/MealSlot'
        day:
          type: string
          format: date-time
          description: Midnight of the service day in the mess time zone.
        closedAt:
          type: string
          format: date-time
          nullable: true
        finalEntries:
          $ref: '#/components/schemas/CountReading'
        shortages:
          type: array
          items:
            type: object
            required: [status]
            properties:
              dishName:
                type: string
                nullable: true
              status:
                type: string
                enum: [active, resolved]
              resolvedAt:
                type: string
                format: date-time
                nullable: true
        waste:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [notRecorded, recorded]
            recordedAt:
              type: string
              format: date-time
              nullable: true
        wasteReport:
          allOf:
            - $ref: '#/components/schemas/WasteReport'
          nullable: true

    AnswerCounts:
      description: DRAFT 0.2.0. Keys follow `MealIntention` plus `noResponse`.
      type: object
      required: [in, skip, notSure, noResponse]
      properties:
        in:
          type: integer
          minimum: 0
        skip:
          type: integer
          minimum: 0
        notSure:
          type: integer
          minimum: 0
        noResponse:
          type: integer
          minimum: 0

    StudentRef:
      description: DRAFT 0.2.0. A student as staff see them, by masked SRM ID only.
      type: object
      required: [id, maskedId]
      properties:
        id:
          type: string
        maskedId:
          type: string
          example: '••0238'

    EnteredWithoutVoting:
      description: DRAFT 0.2.0.
      type: object
      required: [mealId, student, enteredAt]
      properties:
        mealId:
          type: string
        student:
          $ref: '#/components/schemas/StudentRef'
        enteredAt:
          type: string
          format: date-time

    EntryCode:
      description: DRAFT 0.2.0.
      type: object
      required: [payload, lastFour]
      properties:
        payload:
          type: string
        lastFour:
          type: string
          pattern: '^[0-9]{4}$'

    ResolveEntryRequest:
      description: DRAFT 0.2.0.
      type: object
      required: [kind, value]
      properties:
        kind:
          type: string
          enum: [qrPayload, lastFour]
        value:
          type: string

    ResolveEntryResponse:
      description: DRAFT 0.2.0. `student` is present only for `student`; `servingNow` is null when no meal is being served.
      type: object
      required: [result]
      properties:
        result:
          type: string
          enum: [student, notRecognised, wrongMeal]
        student:
          allOf:
            - $ref: '#/components/schemas/StudentRef'
          nullable: true
        servingNow:
          allOf:
            - $ref: '#/components/schemas/MealSlot'
          nullable: true

    SOSReport:
      description: DRAFT 0.2.0.
      type: object
      required: [title, place]
      properties:
        title:
          type: string
          minLength: 1
        place:
          type: string
          minLength: 1

    SOSCase:
      description: DRAFT 0.2.0. Only the Supervisor closes a case; a claim or a check does not close it.
      type: object
      required: [id, messId, title, place, raisedAt, checks, status]
      properties:
        id:
          type: string
        messId:
          type: string
        title:
          type: string
        place:
          type: string
        raisedAt:
          type: string
          format: date-time
        claim:
          type: object
          nullable: true
          required: [role, at]
          properties:
            role:
              $ref: '#/components/schemas/Role'
            at:
              type: string
              format: date-time
        checks:
          type: array
          items:
            type: object
            required: [role, at]
            properties:
              role:
                $ref: '#/components/schemas/Role'
              at:
                type: string
                format: date-time
        status:
          type: object
          required: [state]
          properties:
            state:
              type: string
              enum: [open, closed]
            at:
              type: string
              format: date-time
              nullable: true
            by:
              allOf:
                - $ref: '#/components/schemas/Role'
              nullable: true

    Mess:
      description: DRAFT 0.2.0.
      type: object
      required: [id, name, timeZone]
      properties:
        id:
          type: string
        name:
          type: string
        timeZone:
          type: string
          example: Asia/Kolkata

    SignInRequest:
      description: DRAFT 0.2.0.
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1

    Session:
      description: |
        DRAFT 0.2.0. `token` is the opaque credential; the app keeps it in the Keychain and never reads, logs or shows it.
        `staff` is set only for the four mess staff roles, `student` only for students.
      type: object
      required: [token, account]
      properties:
        token:
          type: string
        account:
          type: object
          required: [id, displayName, email, role, scope]
          properties:
            id:
              type: string
            displayName:
              type: string
            email:
              type: string
            role:
              $ref: '#/components/schemas/Role'
            scope:
              type: object
              required: [kind, id]
              properties:
                kind:
                  type: string
                  enum: [mess, hostel]
                id:
                  type: string
        staff:
          type: object
          nullable: true
          required: [role, mess, staffInitials, supervisorName]
          properties:
            role:
              $ref: '#/components/schemas/Role'
            mess:
              $ref: '#/components/schemas/Mess'
            staffInitials:
              type: string
            supervisorName:
              type: string
        student:
          type: object
          nullable: true
          required: [student, mess]
          properties:
            student:
              $ref: '#/components/schemas/StudentRef'
            mess:
              $ref: '#/components/schemas/Mess'
