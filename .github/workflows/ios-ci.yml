# MealLoop CI: a fast gate on Linux, then one macOS job only when the app changed.
#
#   rules (ubuntu, ~20 s)  Commit messages, tracked junk, and whether ios/ or this workflow changed. Always runs.
#   ios   (macOS)          Only when ios/ or .github/workflows/ changed, or when started by hand:
#                          Debug unit tests once, then the Review and Release builds compile (not tested again),
#                          then a check that the Release app holds no demo code.
#
# The Review scheme runs the same test suite as Debug with other flags, so a pull request compiles it instead of
# testing it twice. Start the workflow by hand with "Review tests" ticked to run that suite as well.
name: ios-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      review_tests:
        description: Also run the test suite under the Review scheme
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    name: commit and repository rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.changes.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the commit range and what changed
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          else
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then BASE="$BEFORE"; else BASE="HEAD~1"; fi
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Changed since $BASE:"
          git diff --name-only "$BASE" HEAD | tee changed.txt
          if grep -qE '^(ios/|\.github/workflows/)' changed.txt; then ios=true; else ios=false; fi
          echo "ios=$ios" >> "$GITHUB_OUTPUT"
          echo "App or workflow changed: $ios"

      - name: Commit messages and tracked junk
        shell: bash
        run: |
          set -u
          fail=0
          RANGE="${{ steps.changes.outputs.base }}..HEAD"
          # No co-author trailers, no tool-attribution lines.
          if git log "$RANGE" --format=%B | grep -i -E '^co-authored-by:|generated with|claude\.ai/code'; then
            echo "::error::A commit message has a co-author trailer or a tool attribution line."; fail=1
          fi
          # Conventional Commits for every non-merge commit.
          while IFS=$'\t' read -r sha subject; do
            if ! echo "$subject" | grep -q -E '^(feat|fix|docs|design|chore|refactor|test|spike)(\([^)]+\))?: .+'; then
              echo "::error::Commit $sha does not follow Conventional Commits: $subject"; fail=1
            fi
          done < <(git log "$RANGE" --no-merges --format='%h%x09%s')
          # No editor or Xcode user files tracked.
          if git ls-files | grep -E '(^|/)\.DS_Store$|xcuserdata/|\.xcuserstate$'; then
            echo "::error::Tracked files that should be ignored (listed above)."; fail=1
          fi
          exit $fail

  ios:
    name: build and test
    needs: rules
    if: needs.rules.outputs.ios == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      # The index store is only for the IDE; CI never reads it.
      FLAGS: CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO
    steps:
      # The app and its tests read only ios/; docs and design (about 4,000 files) stay out of the checkout.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ios
            .github
          sparse-checkout-cone-mode: true

      - name: Select Xcode and boot an iPhone simulator
        id: sim
        shell: bash
        run: |
          X=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']; best = ''
          for runtime in sorted(devices):
              for device in devices[runtime]:
                  if device.get('isAvailable') and device['name'].startswith('iPhone'): best = device['udid']
          print(best)")
          if [ -z "$UDID" ]; then echo "::error::No iPhone simulator is available on this runner"; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          # Boot in the background so it is ready when the test build finishes.
          xcrun simctl boot "$UDID" >/dev/null 2>&1 &

      - name: Unit tests (Debug)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test -project ios/MealLoop.xcodeproj -scheme "MealLoop" \
            -destination "id=${{ steps.sim.outputs.udid }}" -parallel-testing-enabled NO \
            -resultBundlePath build/debug.xcresult $FLAGS | tail -25

      - name: Unit tests (Review), on request only
        if: github.event_name == 'workflow_dispatch' && inputs.review_tests
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test -project ios/MealLoop.xcodeproj -scheme "MealLoop Review" \
            -destination "id=${{ steps.sim.outputs.udid }}" -parallel-testing-enabled NO \
            -resultBundlePath build/review.xcresult $FLAGS | tail -25

      - name: Review and Release builds
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build -project ios/MealLoop.xcodeproj -scheme "MealLoop Review" \
            -destination "generic/platform=iOS Simulator" -derivedDataPath build/review $FLAGS | tail -5
          xcodebuild build -project ios/MealLoop.xcodeproj -scheme "MealLoop" -configuration Release \
            -destination "generic/platform=iOS Simulator" -derivedDataPath build/release $FLAGS | tail -5

      - name: No demo code in the Release app
        shell: bash
        run: |
          app=build/release/Build/Products/Release-iphonesimulator/MealLoop.app/MealLoop
          # RemoteAPI must be found, so an empty or unreadable binary can't pass this check.
          strings -a "$app" | grep -q RemoteAPI || { echo "::error::Could not read type names from $app"; exit 1; }
          # Types compiled only with DEMO_DATA or REVIEW_DATA. (DemoControlling is declared for every build on purpose.)
          for name in DemoDataProvider DemoSeed InMemoryOutingCaseRepository RunningDemoClock; do
            if strings -a "$app" | grep -q "$name"; then echo "::error::$name is in the Release app"; exit 1; fi
          done
          echo "The Release app holds no demo code."

      - name: Keep the result bundles when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: build/*.xcresult
          retention-days: 7
